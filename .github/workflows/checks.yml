name: Offline checks and source hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_public.py
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/run_offline_checks.py
